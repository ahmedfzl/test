<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahmed Gym Manual v3</title><style>html,body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading span{color:#aeb8ca}</style></head><body><div class="loading"><div><b>Loading Ahmed’s gym manual…</b><br><span>Wednesday Day 1 → Saturday Day 2 → Monday Day 3</span></div></div><script>
const SOURCE='https://raw.githubusercontent.com/ahmedfzl/test/main/gym-manual.html';
const CSS=`<style>
.mw-direct{display:inline-flex!important;align-items:center;margin-top:6px;padding:6px 9px;border:1px solid #46719b!important;border-radius:9px;background:#142a43!important;color:#cbe7ff!important;text-decoration:none!important;font-size:.72rem!important;font-weight:800!important}.mw-direct.small{padding:4px 7px;font-size:.68rem!important;margin:4px 0 0}.sessionbar{background:linear-gradient(135deg,#11253a,#142033);border:1px solid #315174;border-radius:14px;padding:12px;margin:10px 0 14px}.session-title{font-weight:850}.session-meta{font-size:.77rem;color:#aeb8ca;margin:4px 0 9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{appearance:none;border:1px solid #42658a;background:#172b43;color:#e9f4ff;padding:9px 11px;border-radius:9px;font-weight:800;cursor:pointer}.actions .primary{background:#174b38;border-color:#2d7a5e;color:#cffff0}.actions .danger{background:#3a2025;border-color:#75404b;color:#ffd3d9}.status{font-size:.76rem;margin-top:8px;color:#8fe0ba;min-height:1.1em}.setlog{margin-top:10px;border-top:1px solid #2b3b54;padding-top:8px}.sethead,.setrow{display:grid;grid-template-columns:52px 1fr 1fr;gap:7px;align-items:start}.sethead{font-size:.65rem;color:#8194ad}.setrow{margin:7px 0}.setnum{font-weight:800;color:#a9bdd6;padding-top:10px}.setcell input{width:100%;background:#0b1220;color:#fff;border:1px solid #32415c;border-radius:9px;padding:9px;font-size:.9rem}.previous{grid-column:2/4;font-size:.7rem;color:#8fa1b7;margin-top:-3px}.previous b{color:#bcd4ef}.history{margin-top:10px}.version{background:#0f1728;border:1px solid #293a55;border-radius:10px;padding:9px;margin:7px 0}.version-title{font-weight:800;font-size:.82rem}.version-date{color:#91a3ba;font-size:.72rem}.version-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:5px;font-size:.73rem;color:#c3cfdf}.version-grid b{color:#fff}.cycle-note{color:#bdd8ff;font-size:.82rem;margin:4px 0 9px}.cycle-note b{color:#fff}.topcycle{padding:10px 2px;color:#b8c3d5;font-size:.82rem}@media(max-width:620px){.version-grid{grid-template-columns:1fr}.sethead,.setrow{grid-template-columns:44px 1fr 1fr}}
</style>`;
const JS=`<script>
(function(){
const STORE='ahmedGymV5';
const MAP={sat:{id:'day1',weekday:'Wednesday',label:'Day 1 · Chest + Lats Priority'},mon:{id:'day2',weekday:'Saturday',label:'Day 2 · Legs + Back Priority'},wed:{id:'day3',weekday:'Monday',label:'Day 3 · Chest + Back Volume'}};
const LIB='https://musclewiki.com/exercises';
function state(){try{return JSON.parse(localStorage.getItem(STORE))||{drafts:{},history:{}}}catch(e){return{drafts:{},history:{}}}}
function put(s){localStorage.setItem(STORE,JSON.stringify(s))}
function key(d,i){return d+':'+i}
function last(d){const h=state().history[d]||[];return h.length?h[h.length-1]:null}
function slug(s){return s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function link(name){const generic=['easy rower or bike','easy bike','specific ramp-up sets','machine chest press ramp-up','light pulldown / assisted pull-up ramp'];return generic.includes(name.toLowerCase())?LIB:'https://musclewiki.com/exercise/'+slug(name)}
function button(name,label='Open in MuscleWiki'){const a=document.createElement('a');a.className='mw-direct';a.target='_blank';a.rel='noopener';a.href=link(name);a.textContent='↗ '+label;return a}
function setStatus(id,msg,bad){const e=document.getElementById('status-'+id);if(e){e.textContent=msg;e.style.color=bad?'#ffb0b0':'#8fe0ba'}}
function historyHTML(dayId,sec){const h=(state().history[dayId]||[]).slice().reverse();if(!h.length)return'<div style="color:#aeb8ca">No saved sessions yet.</div>';const cards=[...sec.querySelectorAll('.ex')];return h.map(v=>{let rows=[];Object.entries(v.exercises||{}).forEach(([k,e])=>{const i=+k.split(':')[1],name=cards[i]?.querySelector('.name a')?.textContent?.replace(/^\\d+\\.\\s*/,'')||e.name||k;rows.push('<div><b>'+name+'</b><br>'+e.sets.map((s,j)=>'S'+(j+1)+' '+(s.w||'—')+'×'+(s.r||'—')).join(' · ')+'</div>')});return'<div class="version"><div class="version-title">Version '+v.version+'</div><div class="version-date">'+new Date(v.savedAt).toLocaleString()+'</div><div class="version-grid">'+rows.join('')+'</div></div>'}).join('')}
function addLinks(root){root.querySelectorAll('.ex').forEach(card=>{if(card.querySelector('.top .mw-direct'))return;const t=card.querySelector('.name a');if(!t)return;const n=t.textContent.replace(/^\\d+\\.\\s*/,'').trim();(card.querySelector('.top>div:last-child')||card.querySelector('.top')).appendChild(button(n));});root.querySelectorAll('.alt').forEach(a=>{if(a.querySelector('.mw-direct'))return;const old=a.querySelector('a');if(old){const b=button(old.textContent.trim(),'MuscleWiki');b.classList.add('small');a.appendChild(b)}});root.querySelectorAll('.mini').forEach(m=>{if(m.querySelector('.mw-direct'))return;const n=m.querySelector('b')?.textContent?.trim();if(n){const b=button(n,link(n)===LIB?'MuscleWiki library':'Open in MuscleWiki');b.classList.add('small');m.appendChild(b)}})}
function makeLogs(sec,cfg){const s=state(),draft=s.drafts[cfg.id]||{},prev=last(cfg.id);[...sec.querySelectorAll('.ex')].forEach((card,i)=>{card.querySelector('.log')?.remove();card.querySelector('.setlog')?.remove();const chip=card.querySelector('.chip.primary')?.textContent||'3';const sets=parseInt(chip.match(/\\d+/)?.[0]||'3',10);const k=key(cfg.id,i),d=draft[k]||{sets:Array.from({length:sets},()=>({w:'',r:''}))},p=prev?.exercises?.[k];const box=document.createElement('div');box.className='setlog';box.innerHTML='<div class="sethead"><span></span><span>WEIGHT (kg)</span><span>REPS</span></div>'+Array.from({length:sets},(_,j)=>{const ds=d.sets[j]||{w:'',r:''},ps=p?.sets?.[j];return'<div class="setrow"><div class="setnum">Set '+(j+1)+'</div><div class="setcell"><input inputmode="decimal" data-day="'+cfg.id+'" data-ex="'+i+'" data-set="'+j+'" data-field="w" value="'+(ds.w||'')+'" placeholder="Weight"></div><div class="setcell"><input inputmode="numeric" data-day="'+cfg.id+'" data-ex="'+i+'" data-set="'+j+'" data-field="r" value="'+(ds.r||'')+'" placeholder="Reps"></div><div class="previous">'+(ps&&(ps.w||ps.r)?'Previous: <b>'+(ps.w||'—')+' kg × '+(ps.r||'—')+'</b>':'Previous: —')+'</div></div>'}).join('');card.querySelector('.body')?.prepend(box)});sec.querySelectorAll('input[data-day]').forEach(inp=>inp.oninput=()=>{const st=state(),d=inp.dataset.day,i=+inp.dataset.ex,j=+inp.dataset.set,f=inp.dataset.field,card=sec.querySelectorAll('.ex')[i],sets=parseInt(card.querySelector('.chip.primary')?.textContent.match(/\\d+/)?.[0]||'3',10),k=key(d,i);st.drafts[d]=st.drafts[d]||{};st.drafts[d][k]=st.drafts[d][k]||{sets:Array.from({length:sets},()=>({w:'',r:''}))};st.drafts[d][k].sets[j][f]=inp.value;put(st)}}
function save(dayId,sec){const st=state(),draft=st.drafts[dayId]||{},cards=[...sec.querySelectorAll('.ex')],exercises={},has=false;cards.forEach((card,i)=>{const sets=parseInt(card.querySelector('.chip.primary')?.textContent.match(/\\d+/)?.[0]||'3',10),k=key(dayId,i),d=draft[k]||{sets:Array.from({length:sets},()=>({w:'',r:''}))},arr=d.sets.map(x=>({w:(x.w||'').trim(),r:(x.r||'').trim()}));if(arr.some(x=>x.w||x.r))has=true;exercises[k]={name:card.querySelector('.name a')?.textContent?.replace(/^\\d+\\.\\s*/,'')||k,sets:arr}});if(!has){setStatus(dayId,'Nothing entered yet.',true);return}st.history[dayId]=st.history[dayId]||[];const version=st.history[dayId].length+1;st.history[dayId].push({version,savedAt:new Date().toISOString(),exercises});st.drafts[dayId]={};put(st);patch();setStatus(dayId,'Saved Version '+version+'. Inputs are blank for the next session.');}
function copy(dayId){const st=state(),p=last(dayId);if(!p){setStatus(dayId,'No previous session yet.',true);return}st.drafts[dayId]={};Object.entries(p.exercises).forEach(([k,e])=>st.drafts[dayId][k]={sets:e.sets.map(x=>({w:x.w||'',r:''}))});put(st);patch();setStatus(dayId,'Previous weights copied. Reps are blank for today.');}
function clear(dayId){const st=state();st.drafts[dayId]={};put(st);patch();setStatus(dayId,'Current unsaved inputs cleared.',true)}
function bar(sec,cfg){sec.querySelector('.sessionbar')?.remove();const h=state().history[cfg.id]||[],p=last(cfg.id),b=document.createElement('div');b.className='sessionbar';b.innerHTML='<div class="session-title">'+cfg.weekday+' session log</div><div class="session-meta">Saved versions: '+h.length+(p?' · Last: Version '+p.version+' · '+new Date(p.savedAt).toLocaleDateString():'')+'</div><div class="actions"><button class="primary">Save as new session</button><button class="copy">Copy previous weights</button><button class="danger">Clear current draft</button></div><div class="status" id="status-'+cfg.id+'"></div><details class="history"><summary>View saved session history</summary>'+historyHTML(cfg.id,sec)+'</details>';const first=sec.querySelector('.box');sec.insertBefore(b,first);b.querySelector('.primary').onclick=()=>save(cfg.id,sec);b.querySelector('.copy').onclick=()=>copy(cfg.id);b.querySelector('.danger').onclick=()=>clear(cfg.id)}
function patch(){const app=document.getElementById('app');if(!app)return;const order=['sat','mon','wed'];order.forEach(old=>{const sec=document.getElementById(old),cfg=MAP[old];if(!sec)return;const h2=sec.querySelector('h2');if(h2)h2.textContent=cfg.weekday;const foc=sec.querySelector('.focus');if(foc)foc.textContent=cfg.label;let cn=sec.querySelector('.cycle-note');if(!cn){cn=document.createElement('div');cn.className='cycle-note';h2?.after(cn)}cn.innerHTML='<b>Cycle:</b> Wednesday Day 1 → Saturday Day 2 → Monday Day 3 → repeat';addLinks(sec);makeLogs(sec,cfg);bar(sec,cfg)});const nav=document.querySelector('nav');if(nav)nav.innerHTML='<a href="#sat">Wed · Day 1</a><a href="#mon">Sat · Day 2</a><a href="#wed">Mon · Day 3</a><a href="#rules">Rules</a>';const hp=document.querySelector('.hero p');if(hp)hp.innerHTML='Recurring cycle based on the session you already started: <b>Wednesday Day 1 → Saturday Day 2 → Monday Day 3 → repeat.</b>';const stats=document.querySelector('.stats');if(stats)stats.firstElementChild.innerHTML='<b>Wed · Sat · Mon</b><small>training cycle</small>';let top=document.querySelector('.topcycle');if(!top){top=document.createElement('div');top.className='topcycle';nav?.after(top)}top.innerHTML='Finish the workout, enter each set, then press <b>Save as new session</b>. It stores a dated Version and clears today’s inputs. Next time, each set shows your previous weight/reps and History keeps every older version.'}
window.addEventListener('load',()=>setTimeout(patch,50));setTimeout(patch,900);
})();
<\/script>`;
fetch(SOURCE,{cache:'no-store'}).then(r=>r.text()).then(html=>{html=html.replace('</head>',CSS+'</head>').replace('</body>',JS+'</body>');document.open();document.write(html);document.close()}).catch(e=>document.body.innerHTML='<div class="loading"><b>Could not load manual.</b><br><span>'+e.message+'</span></div>');
</script></body></html>
