<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahmed Gym Manual v3</title>
<style>
html,body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading b{display:block;font-size:1.2rem;margin-bottom:8px}.loading span{color:#aeb8ca}
</style>
</head>
<body>
<div class="loading"><div><b>Loading Ahmed’s gym manual…</b><span>Correct cycle: Wed Day 1 → Sat Day 2 → Mon Day 3.</span></div></div>
<script>
const SOURCE='https://raw.githubusercontent.com/ahmedfzl/test/main/gym-manual.html';
const LIB='https://musclewiki.com/exercises';
const EXTRA_CSS=`<style>
.mw-direct{display:inline-flex!important;align-items:center;gap:5px;margin-top:7px;padding:6px 9px;border:1px solid #46719b!important;border-radius:9px;background:#142a43!important;color:#cbe7ff!important;text-decoration:none!important;font-size:.72rem!important;font-weight:800!important;line-height:1.2}.mw-direct.small{padding:4px 7px;font-size:.68rem!important;margin:4px 0 0}.alt .mw-direct{margin-left:7px}
.sessionbar{background:linear-gradient(135deg,#11253a,#142033);border:1px solid #315174;border-radius:14px;padding:12px;margin:10px 0 14px}.sessionbar .session-title{font-weight:800;font-size:.95rem}.sessionbar .lastsaved{font-size:.76rem;color:#aeb8ca;margin:3px 0 9px}.session-actions{display:flex;gap:7px;flex-wrap:wrap}.session-actions button{appearance:none;border:1px solid #42658a;background:#172b43;color:#e9f4ff;padding:8px 10px;border-radius:9px;font-weight:750;cursor:pointer}.session-actions button.primary{background:#174b38;border-color:#2d7a5e;color:#cffff0}.session-actions button.warn{background:#3b2c17;border-color:#705528;color:#ffe2a7}.save-status{font-size:.75rem;margin-top:8px;color:#8fe0ba;min-height:1em}
.setlog{margin-top:10px;border-top:1px solid #2b3b54;padding-top:8px}.setrow{display:grid;grid-template-columns:50px 1fr 1fr;gap:7px;align-items:start;margin:7px 0}.setnum{font-weight:800;color:#a9bdd6;padding-top:9px}.setcell label{display:block;font-size:.66rem;color:#8fa1b7;margin:0 0 3px 2px}.setcell input{width:100%;background:#0b1220;color:#fff;border:1px solid #32415c;border-radius:9px;padding:9px;font-size:.9rem}.prev{grid-column:2/4;font-size:.69rem;color:#8fa1b7;margin-top:-3px}.prev b{color:#bcd4ef}
.cyclebadge{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:999px;background:#173a30;color:#9ce5c3;font-size:.68rem;font-weight:800;vertical-align:middle}.cycle-note{padding:11px 12px;margin:10px 0;background:#122619;border:1px solid #315f44;border-radius:12px;color:#c9f3da;font-size:.84rem}.oldlog{display:none!important}
@media(max-width:520px){.setrow{grid-template-columns:43px 1fr 1fr}.session-actions button{flex:1 1 auto}}
</style>`;
function slug(s){return s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function linkFor(n){const g=['easy rower or bike','easy bike','specific ramp-up sets','machine chest press ramp-up','light pulldown / assisted pull-up ramp'];return g.includes(n.toLowerCase())?LIB:'https://musclewiki.com/exercise/'+slug(n)}
function mwBtn(name,label='Open in MuscleWiki',small=false){const a=document.createElement('a');a.className='mw-direct'+(small?' small':'');a.href=linkFor(name);a.target='_blank';a.rel='noopener';a.textContent='↗ '+label;return a}
function nsets(text){const m=(text||'').match(/(\d+)\s*[×x]/i);return m?parseInt(m[1],10):3}
function exerciseName(card){const t=card.querySelector('.name a,.name');return t?t.textContent.replace(/^\d+\.\s*/,'').trim():'Exercise'}
function sessionKey(sec){return sec.dataset.sessionKey}
function historyKey(sec){return 'gymhist:'+sessionKey(sec)}
function draftKey(sec){return 'gymdraft:'+sessionKey(sec)}
function getHistory(sec){try{return JSON.parse(localStorage.getItem(historyKey(sec))||'[]')}catch{return[]}}
function getDraft(sec){try{return JSON.parse(localStorage.getItem(draftKey(sec))||'{}')}catch{return{}}}
function saveDraft(sec){const d={};sec.querySelectorAll('.setinput').forEach(i=>d[i.dataset.field]=i.value);localStorage.setItem(draftKey(sec),JSON.stringify(d))}
function previousSession(sec){const h=getHistory(sec);return h.length?h[h.length-1]:null}
function addSetLogs(sec){const prev=previousSession(sec),draft=getDraft(sec);sec.querySelectorAll('.ex').forEach((card,i)=>{const chips=card.querySelectorAll('.chip');const dose=chips.length?chips[0].textContent:'';const count=nsets(dose);const name=exerciseName(card);const old=card.querySelector('.log');if(old)old.classList.add('oldlog');if(card.querySelector('.setlog'))return;const box=document.createElement('div');box.className='setlog';for(let s=1;s<=count;s++){const row=document.createElement('div');row.className='setrow';const base=`e${i}:s${s}`;const p=prev&&prev.exercises&&prev.exercises[i]&&prev.exercises[i].sets&&prev.exercises[i].sets[s-1];row.innerHTML=`<div class="setnum">Set ${s}</div><div class="setcell"><label>Weight / resistance</label><input class="setinput" inputmode="decimal" data-field="${base}:w" placeholder="kg / level"></div><div class="setcell"><label>Reps</label><input class="setinput" inputmode="numeric" data-field="${base}:r" placeholder="reps"></div><div class="prev">Previous: <b>${p&&p.weight?p.weight:'—'}${p&&p.reps?' × '+p.reps:''}</b></div>`;box.appendChild(row)}card.querySelector('.body').appendChild(box);box.querySelectorAll('.setinput').forEach(inp=>{if(draft[inp.dataset.field]!=null)inp.value=draft[inp.dataset.field];inp.addEventListener('input',()=>saveDraft(sec))});});}
function collectSession(sec){const exercises=[];sec.querySelectorAll('.ex').forEach((card,i)=>{const sets=[];card.querySelectorAll('.setrow').forEach(row=>{const ins=row.querySelectorAll('.setinput');sets.push({weight:ins[0]?.value||'',reps:ins[1]?.value||''})});exercises.push({name:exerciseName(card),sets})});return{date:new Date().toISOString(),day:sec.dataset.dayLabel,session:sec.dataset.sessionLabel,exercises}}
function updatePrevious(sec){const prev=previousSession(sec);sec.querySelectorAll('.ex').forEach((card,i)=>{card.querySelectorAll('.setrow').forEach((row,j)=>{const p=prev&&prev.exercises&&prev.exercises[i]&&prev.exercises[i].sets&&prev.exercises[i].sets[j];const el=row.querySelector('.prev b');if(el)el.textContent=p&&p.weight?(p.weight+(p.reps?' × '+p.reps:'')):'—'})});const last=sec.querySelector('.lastsaved');if(last)last.textContent=prev?'Previous saved session: '+new Date(prev.date).toLocaleString():'No previous saved session yet.'}
function saveSession(sec,status){const h=getHistory(sec);h.push(collectSession(sec));localStorage.setItem(historyKey(sec),JSON.stringify(h));localStorage.removeItem(draftKey(sec));updatePrevious(sec);status.textContent='✓ Session saved. Next time these values appear as Previous.'}
function newSession(sec,status){sec.querySelectorAll('.setinput').forEach(i=>i.value='');localStorage.removeItem(draftKey(sec));status.textContent='New session ready. Previous session is kept below each set.'}
function copyPrevious(sec,status){const p=previousSession(sec);if(!p){status.textContent='No previous session to copy yet.';return}sec.querySelectorAll('.ex').forEach((card,i)=>card.querySelectorAll('.setrow').forEach((row,j)=>{const ps=p.exercises?.[i]?.sets?.[j];const ins=row.querySelectorAll('.setinput');if(ps&&ins[0])ins[0].value=ps.weight||'';if(ins[1])ins[1].value=''}));saveDraft(sec);status.textContent='Previous weights copied; reps cleared for today.'}
function addSessionBar(sec){if(sec.querySelector('.sessionbar'))return;const bar=document.createElement('div');bar.className='sessionbar';bar.innerHTML=`<div class="session-title">${sec.dataset.sessionLabel} <span class="cyclebadge">${sec.dataset.dayLabel}</span></div><div class="lastsaved"></div><div class="session-actions"><button class="primary">Save session</button><button>Copy previous weights</button><button class="warn">Start new session</button></div><div class="save-status"></div>`;const firstBox=sec.querySelector('.box');sec.insertBefore(bar,firstBox||sec.firstChild);const [save,copy,fresh]=bar.querySelectorAll('button'),status=bar.querySelector('.save-status');save.onclick=()=>saveSession(sec,status);copy.onclick=()=>copyPrevious(sec,status);fresh.onclick=()=>newSession(sec,status);updatePrevious(sec)}
function patchMuscleWiki(){document.querySelectorAll('.ex').forEach(card=>{const title=card.querySelector('.name a');if(!title||card.querySelector('.top .mw-direct'))return;const n=exerciseName(card);(card.querySelector('.top>div:last-child')||card.querySelector('.top')).appendChild(mwBtn(n));});document.querySelectorAll('.alt').forEach(el=>{const a=el.querySelector('a');if(a&&!el.querySelector('.mw-direct'))el.appendChild(mwBtn(a.textContent.trim(),'MuscleWiki',true))});document.querySelectorAll('.mini').forEach(el=>{if(el.querySelector('.mw-direct'))return;const b=el.querySelector('b');if(b)el.appendChild(mwBtn(b.textContent.trim(),linkFor(b.textContent.trim())===LIB?'Open MuscleWiki library':'Open in MuscleWiki',true))});document.querySelectorAll('.fin li').forEach(li=>{if(li.querySelector('.mw-direct'))return;let n='';if(li.textContent.includes('Dumbbell Farmer Walk'))n='Dumbbell Farmer Walk';if(li.textContent.includes('Kettlebell Farmers Carry'))n='Kettlebell Farmers Carry';if(n)li.appendChild(mwBtn(n,'Check technique',true))})}
function correctCycle(){const app=document.getElementById('app');if(!app)return;const day1=document.getElementById('sat');const day2=document.getElementById('mon');const day3=document.getElementById('wed');if(!day1||!day2||!day3)return;
// Original source mapping: sat=Day1 Chest+Lats, mon=Day2 Legs+Back, wed=Day3 Chest+Back.
// Actual calendar cycle after user's completed Wednesday session: Wednesday Day1 -> Saturday Day2 -> Monday Day3.
const mapping=[[day1,'Wednesday','Day 1 · Chest + Lats Priority','wed-day1'],[day2,'Saturday','Day 2 · Legs + Back Priority','sat-day2'],[day3,'Monday','Day 3 · Chest + Back Volume','mon-day3']];
mapping.forEach(([sec,day,label,key])=>{sec.dataset.dayLabel=day;sec.dataset.sessionLabel=label;sec.dataset.sessionKey=key;const h2=sec.querySelector('h2');if(h2)h2.textContent=day+' — '+label;});
// Keep the actual session order Day1 → Day2 → Day3, which now corresponds Wed → Sat → Mon.
app.appendChild(day1);app.appendChild(day2);app.appendChild(day3);
const nav=document.querySelector('nav');if(nav){nav.innerHTML='<a href="#sat">Wednesday · Day 1</a><a href="#mon">Saturday · Day 2</a><a href="#wed">Monday · Day 3</a><a href="#rules">Rules</a>'}
const notice=document.createElement('div');notice.className='cycle-note';notice.innerHTML='<b>Current cycle:</b> Wednesday = Day 1 (Chest + Lats) → Saturday = Day 2 (Legs + Back) → Monday = Day 3 (Chest + Back Volume) → repeat.';app.parentNode.insertBefore(notice,app);
mapping.forEach(([sec])=>{addSetLogs(sec);addSessionBar(sec)})}
function apply(){correctCycle();patchMuscleWiki()}
fetch(SOURCE,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Source '+r.status);return r.text()}).then(html=>{html=html.replace('</head>',EXTRA_CSS+'</head>');const injected=`<script>setTimeout(${apply.toString()},80);setTimeout(${apply.toString()},700);<\/script>`;html=html.replace('</body>',injected+'</body>');document.open();document.write(html);document.close()}).catch(e=>{document.body.innerHTML='<div class="loading"><div><b>Could not load the manual.</b><span>'+e.message+'</span></div></div>'});
</script>
</body>
</html>
