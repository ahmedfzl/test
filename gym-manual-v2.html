<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahmed Gym Manual v3</title>
<style>
html,body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.loading b{display:block;font-size:1.2rem;margin-bottom:8px}.loading span{color:#aeb8ca}
</style>
</head>
<body>
<div class="loading"><div><b>Loading Ahmed’s gym manual…</b><span>Workout history + per-set tracking enabled.</span></div></div>
<script>
const SOURCE='https://raw.githubusercontent.com/ahmedfzl/test/main/gym-manual.html';
const PATCH_CSS=`<style>
.mw-direct{display:inline-flex!important;align-items:center;gap:5px;margin-top:7px;padding:6px 9px;border:1px solid #46719b!important;border-radius:9px;background:#142a43!important;color:#cbe7ff!important;text-decoration:none!important;font-size:.72rem!important;font-weight:800!important;line-height:1.2}
.mw-direct.small{padding:4px 7px;font-size:.68rem!important;margin:4px 0 0}.alt .mw-direct{margin-left:7px}
.sessionbar{background:linear-gradient(135deg,#11253a,#142033);border:1px solid #315174;border-radius:14px;padding:12px;margin:10px 0 14px}
.sessionbar .session-title{font-weight:800;font-size:.95rem}.sessionbar .lastsaved{font-size:.76rem;color:#aeb8ca;margin:3px 0 9px}
.session-actions{display:flex;gap:7px;flex-wrap:wrap}.session-actions button{appearance:none;border:1px solid #42658a;background:#172b43;color:#e9f4ff;padding:8px 10px;border-radius:9px;font-weight:750;cursor:pointer}
.session-actions button.primary{background:#174b38;border-color:#2d7a5e;color:#cffff0}.session-actions button.warn{background:#3b2c17;border-color:#705528;color:#ffe2a7}
.save-status{font-size:.75rem;margin-top:8px;color:#8fe0ba;min-height:1em}
.setlog{margin-top:10px;border-top:1px solid #2b3b54;padding-top:8px}.setrow{display:grid;grid-template-columns:50px 1fr 1fr;gap:7px;align-items:start;margin:7px 0}
.setnum{font-weight:800;color:#a9bdd6;padding-top:9px}.setcell label{display:block;font-size:.66rem;color:#8fa1b7;margin:0 0 3px 2px}
.setcell input{width:100%;background:#0b1220;color:#fff;border:1px solid #32415c;border-radius:9px;padding:9px;font-size:.9rem}
.prev{grid-column:2/4;font-size:.69rem;color:#8fa1b7;margin-top:-3px}.prev b{color:#bcd4ef}
.cyclebadge{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:999px;background:#173a30;color:#9ce5c3;font-size:.68rem;font-weight:800;vertical-align:middle}
@media(max-width:520px){.setrow{grid-template-columns:43px 1fr 1fr}.session-actions button{flex:1 1 auto}}
</style>`;
const PATCH_JS=String.raw`<script>
(function(){
 const LIB='https://musclewiki.com/exercises';
 const MAP={
   sat:{label:'Wednesday',cycle:'Day 1',store:'wed-day1'},
   mon:{label:'Saturday',cycle:'Day 2',store:'sat-day2'},
   wed:{label:'Monday',cycle:'Day 3',store:'mon-day3'}
 };
 function slug(s){return s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
 function linkFor(n){const g=['easy rower or bike','easy bike','specific ramp-up sets','machine chest press ramp-up','light pulldown / assisted pull-up ramp'];return g.includes(n.toLowerCase())?LIB:'https://musclewiki.com/exercise/'+slug(n)}
 function btn(n,label,small){const a=document.createElement('a');a.className='mw-direct'+(small?' small':'');a.target='_blank';a.rel='noopener';a.href=linkFor(n);a.textContent='↗ '+label;return a}
 function patchLinks(){
   document.querySelectorAll('.ex').forEach(card=>{const title=card.querySelector('.name a');if(!title||card.querySelector('.top .mw-direct'))return;const n=title.textContent.replace(/^\d+\.\s*/,'').trim();(card.querySelector('.top>div:last-child')||card.querySelector('.top')).appendChild(btn(n,'Open in MuscleWiki',false));});
   document.querySelectorAll('.alt').forEach(el=>{const a=el.querySelector('a');if(!a||el.querySelector('.mw-direct'))return;el.appendChild(btn(a.textContent.trim(),'MuscleWiki',true));});
   document.querySelectorAll('.mini').forEach(el=>{if(el.querySelector('.mw-direct'))return;const b=el.querySelector('b');if(!b)return;const n=b.textContent.trim();el.appendChild(btn(n,linkFor(n)===LIB?'Open MuscleWiki library':'Open in MuscleWiki',true));});
   document.querySelectorAll('.fin li').forEach(li=>{if(li.querySelector('.mw-direct'))return;let n=null;if(li.textContent.includes('Dumbbell Farmer Walk'))n='Dumbbell Farmer Walk';if(li.textContent.includes('Kettlebell Farmers Carry'))n='Kettlebell Farmers Carry';if(n)li.appendChild(btn(n,'Check technique',true));});
 }
 function renameSchedule(){
   const firstStat=document.querySelector('.stats .stat b'); if(firstStat)firstStat.textContent='Wed · Sat · Mon';
   [['sat','Wednesday'],['mon','Saturday'],['wed','Monday']].forEach(([id,label])=>{const a=document.querySelector('nav a[href="#'+id+'"]');if(a)a.textContent=label;});
   Object.entries(MAP).forEach(([id,m])=>{const sec=document.getElementById(id);if(!sec)return;const h2=sec.querySelector('h2');if(h2)h2.innerHTML=m.label+' <span class="cyclebadge">'+m.cycle+'</span>';});
 }
 function countSets(card){const txt=(card.querySelector('.chip.primary')||{}).textContent||'3 ×';const m=txt.match(/(\d+)\s*[×x]/i);return m?parseInt(m[1],10):3}
 function history(dayStore){try{return JSON.parse(localStorage.getItem('ahmedGymHistory:v3:'+dayStore)||'[]')}catch(e){return[]}}
 function draftKey(dayStore,ex){return 'ahmedGymDraft:v3:'+dayStore+':'+ex}
 function getDraft(dayStore,ex){try{return JSON.parse(localStorage.getItem(draftKey(dayStore,ex))||'[]')}catch(e){return[]}}
 function saveDraft(dayStore,ex,sets){localStorage.setItem(draftKey(dayStore,ex),JSON.stringify(sets))}
 function fmtDate(s){try{return new Date(s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}catch(e){return s}}
 function lastSets(dayStore,ex){const h=history(dayStore);if(!h.length)return[];const e=h[0].exercises&&h[0].exercises[ex];return e&&e.sets?e.sets:[]}
 function buildLogger(card,dayStore){
   const title=card.querySelector('.name a');if(!title)return;
   const name=title.textContent.replace(/^\d+\.\s*/,'').trim(),ex=slug(name),n=countSets(card),old=card.querySelector('.log');if(!old)return;
   const previous=lastSets(dayStore,ex),draft=getDraft(dayStore,ex);old.className='setlog';old.innerHTML='';
   for(let i=0;i<n;i++){
     const row=document.createElement('div'),p=previous[i]||{},d=draft[i]||{};row.className='setrow';
     row.innerHTML='<div class="setnum">Set '+(i+1)+'</div><div class="setcell"><label>Weight</label><input inputmode="decimal" data-field="weight" data-set="'+i+'" placeholder="kg" value="'+(d.weight||'')+'"></div><div class="setcell"><label>Reps</label><input inputmode="numeric" data-field="reps" data-set="'+i+'" placeholder="reps" value="'+(d.reps||'')+'"></div><div class="prev">Previous: <b>'+((p.weight||p.reps)?((p.weight||'—')+' kg × '+(p.reps||'—')):'—')+'</b></div>';old.appendChild(row);
   }
   function persist(){const arr=[];for(let i=0;i<n;i++){arr.push({weight:(old.querySelector('[data-set="'+i+'"][data-field="weight"]')||{}).value||'',reps:(old.querySelector('[data-set="'+i+'"][data-field="reps"]')||{}).value||''})}saveDraft(dayStore,ex,arr)}
   old.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',persist));card.dataset.exslug=ex;card.dataset.exname=name;
 }
 function refreshPrevious(sec,dayStore){
   sec.querySelectorAll('.ex').forEach(card=>{const ex=card.dataset.exslug;if(!ex)return;const prev=lastSets(dayStore,ex);card.querySelectorAll('.setrow').forEach((row,i)=>{const p=prev[i]||{},el=row.querySelector('.prev');if(el)el.innerHTML='Previous: <b>'+((p.weight||p.reps)?((p.weight||'—')+' kg × '+(p.reps||'—')):'—')+'</b>';})});
   const h=history(dayStore),ls=sec.querySelector('.lastsaved');if(ls)ls.textContent=h.length?'Last saved: '+fmtDate(h[0].date)+' · '+h.length+' session'+(h.length>1?'s':'')+' stored':'No saved session yet';
 }
 function addSessionBar(id,m){
   const sec=document.getElementById(id);if(!sec)return;sec.querySelectorAll('.ex').forEach(card=>buildLogger(card,m.store));
   const h2=sec.querySelector('h2'),bar=document.createElement('div');bar.className='sessionbar';bar.innerHTML='<div class="session-title">Workout log</div><div class="lastsaved"></div><div class="session-actions"><button class="primary" data-save>Save session</button><button data-copy>Copy previous weights</button><button class="warn" data-new>Start new session</button></div><div class="save-status"></div>';h2.insertAdjacentElement('afterend',bar);
   const status=bar.querySelector('.save-status');
   bar.querySelector('[data-save]').onclick=()=>{const exercises={};let any=false;sec.querySelectorAll('.ex').forEach(card=>{const ex=card.dataset.exslug;if(!ex)return;const sets=[...card.querySelectorAll('.setrow')].map(row=>{const w=row.querySelector('[data-field="weight"]').value.trim(),r=row.querySelector('[data-field="reps"]').value.trim();if(w||r)any=true;return{weight:w,reps:r}});exercises[ex]={name:card.dataset.exname,sets}});if(!any){status.textContent='Nothing entered yet — add at least one set first.';return}const h=history(m.store);h.unshift({date:new Date().toISOString(),exercises});localStorage.setItem('ahmedGymHistory:v3:'+m.store,JSON.stringify(h.slice(0,30)));status.textContent='✓ Session saved. These values will appear as “Previous” next time.';refreshPrevious(sec,m.store)};
   bar.querySelector('[data-copy]').onclick=()=>{const h=history(m.store);if(!h.length){status.textContent='No previous session to copy yet.';return}sec.querySelectorAll('.ex').forEach(card=>{const ex=card.dataset.exslug,prev=lastSets(m.store,ex);card.querySelectorAll('.setrow').forEach((row,i)=>{const p=prev[i]||{};row.querySelector('[data-field="weight"]').value=p.weight||'';row.querySelector('[data-field="reps"]').value=''});const arr=[...card.querySelectorAll('.setrow')].map(row=>({weight:row.querySelector('[data-field="weight"]').value,reps:''}));saveDraft(m.store,ex,arr)});status.textContent='Previous weights copied. Reps cleared for today.'};
   bar.querySelector('[data-new]').onclick=()=>{sec.querySelectorAll('.ex').forEach(card=>{const ex=card.dataset.exslug;card.querySelectorAll('.setrow input').forEach(inp=>inp.value='');localStorage.removeItem(draftKey(m.store,ex))});status.textContent='New session started. Previous history is still saved.'};
   refreshPrevious(sec,m.store);
 }
 function init(){renameSchedule();patchLinks();Object.entries(MAP).forEach(([id,m])=>addSessionBar(id,m))}
 init();
})();
<\/script>`;
fetch(SOURCE,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Source '+r.status);return r.text()}).then(html=>{html=html.replace('</head>',PATCH_CSS+'</head>');html=html.replace('</body>',PATCH_JS+'</body>');document.open();document.write(html);document.close()}).catch(e=>{document.body.innerHTML='<div class="loading"><div><b>Could not load the manual.</b><span>'+e.message+'</span></div></div>'});
</script>
</body>
</html>
