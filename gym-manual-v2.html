<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahmed Gym Manual v2</title><style>html,body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading b{display:block;font-size:1.2rem;margin-bottom:8px}.loading span{color:#aeb8ca}</style></head><body><div class="loading"><div><b>Loading Ahmed’s gym manual…</b><span>Adding explicit MuscleWiki links to every section.</span></div></div><script>
const SOURCE='https://raw.githubusercontent.com/ahmedfzl/test/main/gym-manual.html';
const LIB='https://musclewiki.com/exercises';
function slug(s){return s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function exactLink(name){const generic=['easy rower or bike','easy bike','specific ramp-up sets','machine chest press ramp-up','light pulldown / assisted pull-up ramp'];if(generic.includes(name.toLowerCase()))return LIB;return 'https://musclewiki.com/exercise/'+slug(name)}
const patch=`<style>
.mw-direct{display:inline-flex!important;align-items:center;gap:5px;margin-top:7px;padding:6px 9px;border:1px solid #46719b!important;border-radius:9px;background:#142a43!important;color:#cbe7ff!important;text-decoration:none!important;font-size:.72rem!important;font-weight:800!important;line-height:1.2}.mw-direct:hover{background:#1a3758!important;border-color:#6c9bc5!important}.mw-direct.small{padding:4px 7px;font-size:.68rem!important;margin:4px 0 0}.mw-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.mini .mw-direct{display:inline-flex!important}.alt .mw-direct{margin-left:7px}.fallback .mw-direct{margin:10px auto 0}.mw-note{font-size:.72rem;color:#9fb0c4;margin-top:4px}
</style><script>
(function(){
 const LIB='https://musclewiki.com/exercises';
 function slug(s){return s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
 function linkFor(n){const g=['easy rower or bike','easy bike','specific ramp-up sets','machine chest press ramp-up','light pulldown / assisted pull-up ramp'];return g.includes(n.toLowerCase())?LIB:'https://musclewiki.com/exercise/'+slug(n)}
 function btn(n,label,small){const a=document.createElement('a');a.className='mw-direct'+(small?' small':'');a.target='_blank';a.rel='noopener';a.href=linkFor(n);a.textContent='↗ '+label;return a}
 function patch(){
   document.querySelectorAll('.ex').forEach(card=>{const title=card.querySelector('.name a');if(!title||card.querySelector('.top .mw-direct'))return;const n=title.textContent.replace(/^\\d+\\.\\s*/,'').trim();const host=card.querySelector('.top>div:last-child')||card.querySelector('.top');host.appendChild(btn(n,'Open in MuscleWiki',false));});
   document.querySelectorAll('.alt').forEach(el=>{const a=el.querySelector('a');if(!a||el.querySelector('.mw-direct'))return;const n=a.textContent.trim();el.appendChild(btn(n,'MuscleWiki',true));});
   document.querySelectorAll('.mini').forEach(el=>{if(el.querySelector('.mw-direct'))return;const b=el.querySelector('b');if(!b)return;const n=b.textContent.trim();el.appendChild(btn(n,linkFor(n)===LIB?'Open MuscleWiki library':'Open in MuscleWiki',true));});
   document.querySelectorAll('.fin li').forEach(li=>{if(li.querySelector('.mw-direct'))return;let n=null;if(li.textContent.includes('Dumbbell Farmer Walk'))n='Dumbbell Farmer Walk';if(li.textContent.includes('Kettlebell Farmers Carry'))n='Kettlebell Farmers Carry';if(n)li.appendChild(btn(n,'Check technique',true));});
   document.querySelectorAll('.fallback').forEach(f=>{if(f.querySelector('.mw-direct'))return;const card=f.closest('.ex');const t=card&&card.querySelector('.name a');if(t){const n=t.textContent.replace(/^\\d+\\.\\s*/,'').trim();f.appendChild(document.createElement('br'));f.appendChild(btn(n,'Open this exercise in MuscleWiki',false));}});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(patch,50));else setTimeout(patch,50);
 setTimeout(patch,800);
})();
<\/script>`;
fetch(SOURCE,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Source '+r.status);return r.text()}).then(html=>{html=html.replace('</head>',patch.split('<script>')[0]+'</head>');const js='<script>'+patch.split('<script>')[1];html=html.replace('</body>',js+'</body>');document.open();document.write(html);document.close();}).catch(e=>{document.body.innerHTML='<div class="loading"><div><b>Could not load the manual.</b><span>'+e.message+'</span></div></div>'});
</script></body></html>
