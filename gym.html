<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>برنامه تمرینی ۱۴ روزه</title><style>html,body{margin:0;background:#f6f7f9}#gym{display:block;width:100%;border:0;min-height:100vh}</style></head><body><iframe id="gym" title="برنامه تمرینی" src="https://htmlpreview.github.io/?https://raw.githubusercontent.com/ahmedfzl/test/eede8827d27d10ff7f2caf25e7deee333c549cbd/gym.html"></iframe><script>const f=document.getElementById('gym');const DIRECT={'Hack Squat Machine':'https://www.strengthlog.com/hack-squat-machine/','Smith Romanian Deadlift':'https://www.strengthlog.com/smith-machine-romanian-deadlift/','Machine Chest Press':'https://www.strengthlog.com/machine-chest-press/','Leg Press':'https://www.strengthlog.com/leg-press/','Leg Extension':'https://www.strengthlog.com/leg-extension/','Seated Hamstring Curl':'https://www.strengthlog.com/seated-leg-curl/','Lying Hamstring Curl':'https://www.strengthlog.com/lying-leg-curl/','Cable Lateral Raise':'https://www.strengthlog.com/cable-lateral-raise/','Cable Crunch':'https://www.strengthlog.com/cable-crunch/','Face Pull':'https://www.strengthlog.com/face-pull/','Hammer Curl':'https://www.strengthlog.com/hammer-curl/','Machine Hip Thrust':'https://www.strengthlog.com/hip-thrust-machine/','Reverse Pec Deck':'https://www.strengthlog.com/reverse-machine-fly/','Machine Biceps Curl':'https://www.strengthlog.com/machine-biceps-curl/','Cable Biceps Curl':'https://www.strengthlog.com/cable-curl/','Machine Pulldown':'https://www.strengthlog.com/lat-pulldown/','Smith Squat':'https://www.strengthlog.com/smith-machine-squat/','Cable Pull Through':'https://www.strengthlog.com/cable-pull-through/','Seated Calf Raise':'https://www.strengthlog.com/seated-calf-raise/','Standing Calf Raise':'https://www.strengthlog.com/standing-calf-raise/'};function sl(n){return DIRECT[n]||'https://www.strengthlog.com/?s='+encodeURIComponent(n)}function patch(){try{const w=f.contentWindow;if(!w||!w.document)return;const mk=n=>'<div class="links"><a target="_blank" href="'+sl(n)+'">StrengthLog</a><a target="_blank" href="https://www.youtube.com/results?search_query='+encodeURIComponent(n+' exercise form shorts')+'">YouTube Shorts</a><a target="_blank" href="https://www.google.com/search?tbm=vid&q='+encodeURIComponent(n+' exercise form')+'">Google Videos</a></div>';w.L=mk;w.links=mk;w.mw=sl;try{if(typeof w.render==='function')w.render()}catch(e){}const replace=()=>{w.document.querySelectorAll('.links a:first-child').forEach(a=>{let card=a.closest('.card,.alt');let name=card&&card.querySelector('.eng')?card.querySelector('.eng').textContent.trim():'';if(!name&&card){let b=card.querySelector('b');if(b)name=b.textContent.trim()}if(name){a.textContent='StrengthLog';a.href=sl(name)}})};replace();new w.MutationObserver(replace).observe(w.document.body,{childList:true,subtree:true});const resize=()=>{try{f.style.height=Math.max(900,w.document.documentElement.scrollHeight+20)+'px'}catch(e){}};resize();new w.ResizeObserver(resize).observe(w.document.body)}catch(e){console.error(e)}}f.addEventListener('load',patch);</script></body></html>
