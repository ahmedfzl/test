<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برنامه تمرینی ۱۴ روزه</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17191d;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;line-height:1.45}main{max-width:760px;margin:auto;padding:14px 11px 80px}.top,.card{background:#fff;border:1px solid #e1e4e8;border-radius:12px}.top{padding:14px}.top h1{font-size:1.4rem;margin:0}.muted{color:#757b85;font-size:.75rem}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}button{border:1px solid #cfd4d9;background:#fff;border-radius:8px;padding:7px 9px;font-weight:700}.primary{background:#174f3e;color:#fff;border-color:#174f3e}.day{margin-top:24px}.day h2{font-size:1.05rem;margin:0 0 8px}.label{font-size:.72rem;color:#69717c;font-weight:800;margin:13px 2px 6px}.card{padding:10px;margin:7px 0}.eng{direction:ltr;text-align:right;font-weight:850}.fa{font-size:.75rem;color:#747b85}.dose{font-size:.68rem;color:#4d555e;margin-top:3px}.pic{width:100%;height:165px;object-fit:contain;background:#f2f3f5;border:1px solid #e1e4e8;border-radius:8px;margin-top:7px}.links{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px;direction:ltr}.links a{text-align:center;text-decoration:none;color:#175fa8;border:1px solid #e1e4e8;border-radius:7px;padding:6px 2px;font-size:.59rem;font-weight:800}.cue{font-size:.7rem;color:#555d66;margin-top:7px}.prev{font-size:.66rem;background:#f7f8fa;border:1px solid #e1e4e8;border-radius:7px;padding:6px;margin-top:7px}.sets{margin-top:5px}.set{display:grid;grid-template-columns:32px 1fr 1fr;gap:5px;margin-top:5px}.set span{font-size:.64rem;color:#777;padding-top:9px}.set input{width:100%;border:1px solid #d8dce1;border-radius:7px;padding:7px;font-size:.86rem}.alts{margin-top:7px;border-top:1px solid #e7e9ec;padding-top:6px}.alts summary{font-size:.66rem;font-weight:800;color:#616873}.alt{padding:7px 0;border-bottom:1px solid #eef0f2;font-size:.66rem}.alt .links{margin-top:4px}.savebar{position:sticky;bottom:7px;background:#ffffffee;border:1px solid #d7dbe0;border-radius:10px;padding:7px;margin-top:10px}.status{font-size:.67rem;color:#174f3e;margin-top:4px;min-height:14px}select{width:100%;padding:7px;margin-top:6px;border:1px solid #d7dbe0;border-radius:7px;background:#fff}.week{font-size:.78rem;color:#17624b;font-weight:850;margin-top:26px}.note{font-size:.7rem;color:#6c5829;background:#fff8e8;border:1px solid #ead8aa;padding:8px;border-radius:8px;margin-top:9px}@media(max-width:520px){.pic{height:150px}}</style></head><body><main><section class="top"><h1>برنامه تمرینی ۱۴ روزه</h1><div class="muted">چهارشنبه · شنبه · دوشنبه — عکس، لینک مرجع و ثبت آخرین رکورد هر حرکت</div><div class="tools"><button class="primary" id="export">Export JSON</button><button id="import">Import / Merge JSON</button><input id="file" type="file" accept=".json" hidden></div><div id="gst" class="status"></div><div class="note">Previous همیشه آخرین اجرای واقعی همان حرکت را از کل تاریخچه نشان می‌دهد. برای انتقال بین گوشی‌ها JSON را Export و روی گوشی دیگر Import کن.</div></section><div id="app"></div></main><script>const FA={"Stationary Bike":"دوچرخه ثابت","Rowing Machine":"دستگاه روئینگ","Band Pull Apart":"باز کردن کش برای پشت شانه","Wall Slide":"وال اسلاید","Dynamic Hamstring Stretch":"کشش پویای پشت ران","Hip Hinge Drill":"تمرین هیپ‌هینج","Glute Bridge":"پل باسن","Bodyweight Squat":"اسکوات با وزن بدن","Supine Hamstring Stretch":"کشش ایستای پشت ران خوابیده","Kneeling Hip Flexor Stretch":"کشش خم‌کننده ران زانو زده","Lat Stretch":"کشش لت","Farmer Carry":"فارمر کری / حمل وزنه","Incline Chest Press Machine":"پرس بالاسینه دستگاه","Smith Incline Bench Press":"پرس بالاسینه اسمیت","Single Arm Incline Cable Press":"پرس بالاسینه تک‌دست سیم‌کش","Machine Pulldown":"لت پول‌دان دستگاه","Assisted Pull-Up":"بارفیکس کمکی","Plate Loaded Pulldown":"لت پول‌دان وزنه آزاد","Chest Supported Row":"قایقی با تکیه‌گاه سین نچ سیم‌کش","Machine Crunch":"کرانچ دستگاه"};const YT={"Stationary Bike":"8DbpBXGAB8Q","Rowing Machine":"4zWu1yuJ0_g","Hip Hinge Drill":"t4ouk4TmrS8","Kneeling Hip Flexor Stretch":"ktgtEWGhFd8","Farmer Carry":"lLAw6fUccKA","Face Pull":"eTCBSFlCJ_s"};const C={"Band Pull Apart":"Band","Dynamic Hamstring Stretch":"Recovery","Glute Bridge":"Bodyweight","Bodyweight Squat":"Bodyweight","Supine Hamstring Stretch":"Recovery","Lat Stretch":"Recovery","Incline Chest Press Machine":"Machine","Smith Incline Bench Press":"Smith-Machine","Single Arm Incline Cable Press":"Cables","Machine Pulldown":"Machine","Assisted Pull-Up":"Machine","Plate Loaded Pulldown":"Machine","Chest Supported Row":"Machine","Seated Cable Row":"Machine","Seal Row Machine":"Machine","Seated Hamstring Curl":"Machine","Lying Hamstring Curl":"Machine","Cable Pec Fly":"Cables","Pec Deck Fly":"Machine","Incline Cable Fly":"Cables","Cable Lateral Raise":"Cables","Machine Lateral Raise":"Machine","Rope Triceps Pushdown":"Cables","Bar Pushdown":"Cables","Machine Triceps Pushdown":"Machine","Pallof Press":"Cables","Band Pallof Press":"Band","Hack Squat Machine":"Machine","Belt Squat":"Machine","Smith Squat":"Smith-Machine","Smith Romanian Deadlift":"Smith-Machine","Cable Pull Through":"Cables","45 Degree Back Extension":"Machine","Leg Extension":"Machine","Cable Leg Extension":"Cables","Single Arm Underhand Cable Row":"Cables","Cable Rope Pullover":"Cables","Machine Pullover":"Machine","Machine Chest Press":"Machine","Smith Bench Press":"Smith-Machine","Preacher Curl Machine":"Machine","Machine Biceps Curl":"Machine","Dumbbell Preacher Curl":"Dumbbells","Cable Reverse Curl":"Cables","Standing Calf Raise":"Machine","Seated Calf Raise":"Machine","Cable Shrug":"Cables","Smith Shrug":"Smith-Machine","Decline Chest Press Machine":"Machine","Machine Dips":"Machine","Leg Press":"Machine","Smith Split Squat":"Smith-Machine","Machine Hip Thrust":"Machine","Smith Hip Thrust":"Smith-Machine","Reverse Pec Deck":"Machine","Cable Reverse Fly":"Cables","Hammer Curl":"Dumbbells","Cable Biceps Curl":"Cables","Overhead Rope Triceps Extension":"Cables","Machine Overhead Triceps Extension":"Machine","Cable Crunch":"Cables","Machine Crunch":"Machine"};const S=n=>n.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const W1=[['Stationary Bike','4–5 min easy','Or rower',['Rowing Machine']],['Band Pull Apart','1×15','کنترل‌شده',[]],['Wall Slide','1×8–10','قوس کمر نده',[]],['Dynamic Hamstring Stretch','1×8/side','پویا، نه کشش شدید',[]],['Hip Hinge Drill','1×10','تمرین الگوی RDL',[]]],W2=[['Stationary Bike','5 min easy','گرم‌کردن زانو و لگن',[]],['Dynamic Hamstring Stretch','1×8/side','پویا',[]],['Glute Bridge','1×10','انقباض باسن',[]],['Bodyweight Squat','1×10','دامنه راحت',[]],['Hip Hinge Drill','1×10','تمرین RDL',[]]],W3=[['Rowing Machine','4–5 min easy','Or bike',['Stationary Bike']],['Band Pull Apart','1×15','پشت شانه',[]],['Glute Bridge','1×10','انقباض باسن',[]],['Dynamic Hamstring Stretch','1×8/side','پویا',[]],['Bodyweight Squat','1×10','آماده‌سازی',[]]],COOL=[['Supine Hamstring Stretch','2×30–45 sec/side','بدون bounce',[]],['Kneeling Hip Flexor Stretch','30–45 sec/side','قوس کمر نده',[]],['Lat Stretch','30–45 sec','آرام',[]]],F13=[['Rowing Machine','40 sec @ RPE 7–8','با Farmer Carry تناوبی',[]],['Farmer Carry','30–40 m','×4 دور',[]]],F2=[['Stationary Bike','30 sec hard + 60 sec easy ×4','RPE 6–7',[]]];const D1=[['Incline Chest Press Machine',3,'6–10','2–3 min','~2','اکسنتریک کنترل‌شده',['Smith Incline Bench Press','Single Arm Incline Cable Press']],['Machine Pulldown',3,'8–12','2 min','~2','تاب تنه نده',['Assisted Pull-Up','Plate Loaded Pulldown']],['Chest Supported Row',3,'8–12','2 min','~2','سینه روی تکیه‌گاه',['Seated Cable Row','Seal Row Machine']],['Seated Hamstring Curl',3,'10–15','90 sec','1–2','کنترل برگشت',['Lying Hamstring Curl']],['Cable Pec Fly',2,'12–15','60–90 sec','1–2','حرکت قوسی',['Pec Deck Fly','Incline Cable Fly']],['Cable Lateral Raise',3,'12–18','60–90 sec','1–2','بدون shrug',['Machine Lateral Raise']],['Rope Triceps Pushdown',2,'10–15','60–90 sec','1–2','بازو ثابت',['Bar Pushdown','Machine Triceps Pushdown']],['Pallof Press',2,'10–12/side','60 sec','2','ضدچرخش',['Band Pallof Press']]];const D2=[['Hack Squat Machine',4,'6–10','2–3 min','~2','عمق کنترل‌شده',['Belt Squat','Smith Squat']],['Smith Romanian Deadlift',3,'8–10','2–3 min','~2','قبل از جبران کمر متوقف شو',['Cable Pull Through','45 Degree Back Extension']],['Leg Extension',2,'10–15','60–90 sec','1–2','کنترل کامل',['Cable Leg Extension']],['Seated Cable Row',2,'8–12','2 min','~2','بدون تاب تنه',['Chest Supported Row','Single Arm Underhand Cable Row']],['Cable Rope Pullover',2,'10–15','60–90 sec','1–2','آرنج تقریباً ثابت',['Machine Pullover']],['Machine Chest Press',2,'8–12','2 min','~2','حجم ثانویه سینه',['Smith Bench Press']],['Preacher Curl Machine',2,'10–15','60–90 sec','1–2','بازو ثابت',['Machine Biceps Curl','Dumbbell Preacher Curl']],['Standing Calf Raise',3,'10–15','60–90 sec','1–2','مکث بالا و پایین',['Seated Calf Raise']],['Cable Shrug',2,'10–15','60–90 sec','1–2','شانه مستقیم بالا',['Smith Shrug']],['Dead Bug',2,'6–10/side','45–60 sec','2','دنده و لگن ثابت',[]]];const D3=[['Decline Chest Press Machine',3,'8–12','2 min','~2','اکسنتریک کنترل‌شده',['Machine Dips','Machine Chest Press']],['Assisted Pull-Up',3,'8–12','2 min','~2','بدون kipping',['Machine Pulldown']],['Single Arm Underhand Cable Row',2,'10–12/side','90 sec','~2','تنه ثابت',['Seated Cable Row','Chest Supported Row']],['Leg Press',3,'10–15','2–3 min','~2','لگن روی پد',['Smith Split Squat']],['Machine Hip Thrust',3,'8–12','2 min','~2','با باسن تمام کن',['Smith Hip Thrust','Glute Bridge']],['Reverse Pec Deck',3,'12–18','60–90 sec','1–2','پشت شانه',['Face Pull','Cable Reverse Fly']],['Cable Lateral Raise',2,'12–18','60–90 sec','1–2','سبک و strict',['Machine Lateral Raise']],['Hammer Curl',2,'10–15','60–90 sec','1–2','گریپ خنثی',['Machine Biceps Curl']],['Overhead Rope Triceps Extension',2,'10–15','60–90 sec','1–2','آرنج پایدار',['Machine Overhead Triceps Extension']],['Seated Calf Raise',2,'12–20','60–90 sec','1–2','دامنه کامل',['Standing Calf Raise']],['Cable Crunch',2,'10–15','60 sec','1–2','فلکشن تنه کنترل‌شده',['Machine Crunch','Dead Bug']]];const clone=x=>JSON.parse(JSON.stringify(x)),D1B=clone(D1),D2B=clone(D2),D3B=clone(D3);D1B[5][0]='Machine Lateral Raise';D1B[5][6]=['Cable Lateral Raise'];D2B[6]=['Cable Reverse Curl',2,'10–15','60–90 sec','1–2','ساعد و brachioradialis',['Machine Biceps Curl']];D3B[5]=['Face Pull',3,'12–18','60–90 sec','1–2','کنترل کتف',['Reverse Pec Deck','Cable Reverse Fly']];D3B[7]=['Cable Biceps Curl',2,'10–15','60–90 sec','1–2','گریپ supinated',['Preacher Curl Machine','Machine Biceps Curl']];const P=[{k:'A1',w:'A',d:'چهارشنبه',t:'Upper Chest + Lats + Hamstrings',warm:W1,main:D1,fin:F13},{k:'A2',w:'A',d:'شنبه',t:'Quads + Posterior Chain + Back',warm:W2,main:D2,fin:F2},{k:'A3',w:'A',d:'دوشنبه',t:'Lower/Mid Chest + Back + Glutes',warm:W3,main:D3,fin:F13},{k:'B1',w:'B',d:'چهارشنبه',t:'Upper Chest + Lats + Hamstrings',warm:W1,main:D1B,fin:F13},{k:'B2',w:'B',d:'شنبه',t:'Quads + Posterior Chain + Back',warm:W2,main:D2B,fin:F2},{k:'B3',w:'B',d:'دوشنبه',t:'Lower/Mid Chest + Back + Glutes',warm:W3,main:D3B,fin:F13}];const DBK='gym-public-v1-db',DRK='gym-public-v1-draft';let DB=get(DBK,{sessions:[]}),DR=get(DRK,{});function get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function put(k,v){localStorage.setItem(k,JSON.stringify(v))}function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function Q(s){return encodeURIComponent(s)}function meta(n){let y=YT[n],cat=C[n],slug=S(n);return{fa:FA[n]||n,img:y?'https://img.youtube.com/vi/'+y+'/hqdefault.jpg':cat?'https://media.musclewiki.com/media/uploads/og-male-'+cat+'-'+slug+'-front.jpg':'',mw:cat?'https://musclewiki.com/exercise/'+slug:'https://www.google.com/search?q='+Q('site:musclewiki.com '+n+' exercise')}}function L(n){let m=meta(n);return`<div class="links"><a target="_blank" href="${m.mw}">MuscleWiki</a><a target="_blank" href="https://www.youtube.com/results?search_query=${Q(n+' exercise form shorts')}">YouTube Shorts</a><a target="_blank" href="https://www.google.com/search?tbm=vid&q=${Q(n+' exercise form')}">Google Videos</a></div>`}function pic(n){let m=meta(n);return`<a target="_blank" href="https://www.google.com/search?tbm=isch&q=${Q(n+' exercise form')}"><img class="pic" src="${m.img}" alt="${E(n)}" onerror="this.style.display='none'"></a>`}function last(n){let b=null;for(let s of DB.sessions||[])for(let x of s.exercises||[])if(x.name===n){let t=Date.parse(s.date)||0;if(!b||t>b.t)b={t,date:s.date,sets:x.sets||[]}}return b}function prev(n){let r=last(n);return r?`Previous: <b>${r.sets.map((x,i)=>`S${i+1} ${E(x.weight||'—')}${x.reps?' × '+E(x.reps):''}`).join(' · ')}</b>`:'Previous: هنوز رکوردی ندارد.'}function alt(a){return!a?.length?'':`<details class="alts"><summary>Alternativeها</summary>${a.map(n=>`<div class="alt"><b>${E(n)}</b><div class="fa">${E(FA[n]||n)}</div>${L(n)}</div>`).join('')}</details>`}function simple(x){let[n,dose,note,a]=x,m=meta(n);return`<article class="card"><div class="eng">${E(n)}</div><div class="fa">${E(m.fa)}</div><div class="dose"><b>${E(dose)}</b></div>${pic(n)}${L(n)}<div class="cue">${E(note||'')}</div>${alt(a)}</article>`}function card(w,x,i){let[n,sets,reps,rest,rir,cue,a]=x,k=w.k+':'+i,d=DR[k]||{},cur=d.n||n,opts=[n,...a],m=meta(cur);return`<article class="card ex" data-w="${w.k}" data-i="${i}" data-n="${E(cur)}"><div class="eng">${E(cur)}</div><div class="fa">${E(m.fa)}</div><div class="dose"><b>${sets}×${E(reps)}</b> · استراحت ${E(rest)} · ${E(rir)} RIR</div>${pic(cur)}${L(cur)}${opts.length>1?`<select>${opts.map(z=>`<option ${z===cur?'selected':''}>${E(z)}</option>`).join('')}</select>`:''}<div class="cue">${E(cue)}</div><div class="prev">${prev(cur)}</div><div class="sets">${Array.from({length:sets},(_,s)=>`<div class="set"><span>S${s+1}</span><input data-k="weight" data-s="${s}" placeholder="وزن" value="${E(d.sets?.[s]?.weight||'')}"><input data-k="reps" data-s="${s}" placeholder="تکرار" value="${E(d.sets?.[s]?.reps||'')}"></div>`).join('')}</div>${alt(a)}</article>`}function render(){let h='',lw='';for(let w of P){if(w.w!==lw){h+=`<div class="week">Week ${w.w}</div>`;lw=w.w}h+=`<section class="day" id="${w.k}"><h2>${w.d} — ${w.t}</h2><div class="label">گرم کردن</div>${w.warm.map(simple).join('')}<div class="label">تمرین اصلی</div>${w.main.map((x,i)=>card(w,x,i)).join('')}<div class="label">Finisher / Conditioning</div>${w.fin.map(simple).join('')}<div class="label">سرد کردن</div>${COOL.map(simple).join('')}<div class="savebar"><button class="primary save" data-w="${w.k}">Save + JSON</button><button class="new" data-w="${w.k}">جلسه جدید</button><div class="status"></div></div></section>`}document.getElementById('app').innerHTML=h;bind()}function bind(){document.querySelectorAll('.ex').forEach(c=>{let w=c.dataset.w,i=+c.dataset.i,k=w+':'+i,sel=c.querySelector('select');if(sel)sel.onchange=()=>{DR[k]={n:sel.value,sets:[]};put(DRK,DR);render()};c.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{let z=DR[k]||{n:c.dataset.n,sets:[]},s=+inp.dataset.s;z.sets[s]=z.sets[s]||{weight:'',reps:''};z.sets[s][inp.dataset.k]=inp.value;DR[k]=z;put(DRK,DR)})});document.querySelectorAll('.save').forEach(b=>b.onclick=()=>saveWorkout(b));document.querySelectorAll('.new').forEach(b=>b.onclick=()=>{Object.keys(DR).filter(k=>k.startsWith(b.dataset.w+':')).forEach(k=>delete DR[k]);put(DRK,DR);render()})}function saveWorkout(b){let ex=[];document.querySelectorAll(`.ex[data-w="${b.dataset.w}"]`).forEach(c=>{let sets=[...c.querySelectorAll('.set')].map(r=>({weight:r.querySelector('[data-k=weight]').value.trim(),reps:r.querySelector('[data-k=reps]').value.trim()}));if(sets.some(x=>x.weight||x.reps))ex.push({name:c.dataset.n,sets})});if(!ex.length){b.parentElement.querySelector('.status').textContent='چیزی وارد نشده.';return}DB.sessions.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:new Date().toISOString(),exercises:ex});put(DBK,DB);download();render()}function download(){let a=document.createElement('a'),blob=new Blob([JSON.stringify({schema:'gym-public-v1',sessions:DB.sessions},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='gym-log.json';a.click()}document.getElementById('export').onclick=download;document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text()),mp=new Map((DB.sessions||[]).map(s=>[s.id,s]));(x.sessions||[]).forEach(s=>mp.set(s.id,s));DB.sessions=[...mp.values()];put(DBK,DB);document.getElementById('gst').textContent='Import/Merge شد.';render()}catch(err){document.getElementById('gst').textContent='فایل معتبر نیست.'}};render();</script></body></html>
